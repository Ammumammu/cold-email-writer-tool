<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Email Writer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1, h2 {
            color: #ffffff;
        }
        input, textarea, button {
            width: 100%;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            background-color: #6366f1;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #5550bd;
        }
        .paywall button {
            background-color: #6366f1;
        }
        .paywall .email-input {
            margin-bottom: 1rem;
        }
        .viral-attribution {
            font-size: 0.9rem;
            color: #848484;
            margin-top: 1rem;
        }
        .how-it-works {
            margin-top: 2rem;
            line-height: 1.6;
        }
        .paywall .how-it-works {
            display: none;
        }
        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div id="root"></div>
<script>
    const CONFIG = {
        GROQ_KEY: "CONFIG.GROQ_KEY",
        SUPABASE_ANON_KEY: "your-supabase-anon-key",
        SUPABASE_URL: "https://your-supabase-url.supabase.co"
    };

    const { createRoot } = ReactDOM;
    const { useState, useEffect } = React;

    const posthog = window.posthog || [];
    posthog.init('your-posthog-key', { api_host: 'https://app.posthog.com' });

    function App() {
        const [view, setView] = useState('landing');
        const [recipientData, setRecipientData] = useState('');
        const [email, setEmail] = useState('');
        const [uses, setUses] = useState(0);
        const [emailForPaywall, setEmailForPaywall] = useState('');

        useEffect(() => {
            if (uses >= 2) {
                setView('paywall');
            }
        }, [uses]);

        const handleToolOpen = () => {
            posthog.capture('tool_opened');
            setView('tool');
        };

        const handleToolUse = async () => {
            if (uses < 2) {
                posthog.capture('tool_used');
                setUses(prev => prev + 1);
                const response = await fetch('https://api.groq.com/v1/predict', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.GROQ_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama3-70b',
                        prompt: recipientData
                    })
                });
                const data = await response.json();
                setEmail(data.choices[0].text);
            } else {
                posthog.capture('free_limit_hit');
                setView('paywall');
            }
        };

        const handlePaywallShow = () => {
            posthog.capture('paywall_shown');
        };

        const handlePaymentClick = () => {
            posthog.capture('payment_clicked');
            window.location.href = 'https://buy.stripe.com/test_7sY3co2780WadaeeN5g7e01';
        };

        const handleEmailCapture = async (e) => {
            e.preventDefault();
            posthog.capture('email_captured');
            const supabase = new SupabaseClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
            await supabase.from('leads').insert([{ email: emailForPaywall }]);
            setUses(uses + 3);
            setView('tool');
            setEmailForPaywall('');
        };

        return (
            <div className="container">
                {view === 'landing' && (
                    <>
                        <h1>Cold Emails Stalled</h1>
                        <h2>Sales teams craft winning emails in minutes</h2>
                        <div className="how-it-works">
                            <p>Enter recipient data (5 sec) → AI suggests email (10 sec) → Get instant responses (instant)</p>
                        </div>
                        <button onClick={handleToolOpen}>Write Winning Emails</button>
                    </>
                )}
                {view === 'tool' && (
                    <>
                        <h2>Enter Recipient Data</h2>
                        <textarea
                            value={recipientData}
                            onChange={(e) => setRecipientData(e.target.value)}
                            placeholder="Enter recipient details here..."
                        />
                        <button onClick={handleToolUse}>Get Email Suggestion</button>
                        {email && (
                            <>
                                <h2>Suggested Email</h2>
                                <textarea
                                    value={email}
                                    readOnly
                                />
                                <p className="viral-attribution">Generated by Cold Email Writer — cold-email-writer-tool.vercel.app</p>
                            </>
                        )}
                    </>
                )}
                {view === 'paywall' && (
                    <>
                        <h1>Cold Emails Stalled</h1>
                        <h2>Sales teams craft winning emails in minutes</h2>
                        <p>Upgrade to get more uses and features!</p>
                        <button onClick={handlePaymentClick}>Upgrade Now ($9/mo)</button>
                        <h3>Or, enter your email for 3 free uses</h3>
                        <form onSubmit={handleEmailCapture}>
                            <input
                                type="email"
                                value={emailForPaywall}
                                onChange={(e) => setEmailForPaywall(e.target.value)}
                                placeholder="Enter your email..."
                                className="email-input"
                            />
                            <button type="submit">Get 3 Free Uses</button>
                        </form>
                    </>
                )}
            </div>
        );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.0.0/dist/supabase.min.js"></script>
<script src="https://js.posthog.com/posthog.min.js"></script>



<!-- LAUNCH BANNER — Injected by revenue-agent -->
<div id="launch-banner" style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:linear-gradient(90deg,#7c3aed,#2563eb);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -4px 24px rgba(0,0,0,.3);font-family:Inter,sans-serif">
  <div>
    <span style="font-size:13px;opacity:.8">🚀 LAUNCH WEEK OFFER</span>
    <div style="font-size:17px;font-weight:700">Get Cold Email Writer for $19 <span style="text-decoration:line-through;opacity:.6;font-weight:400">$38</span> — lifetime access</div>
  </div>
  <div style="display:flex;gap:12px;align-items:center">
    <a href="https://buy.stripe.com/test_8x2dR2h228oC7PUgVdg7e0a" target="_blank"
       style="background:#fff;color:#7c3aed;padding:10px 22px;border-radius:8px;font-weight:800;font-size:15px;text-decoration:none;white-space:nowrap">
      Buy Now →
    </a>
    <button onclick="document.getElementById('launch-banner').style.display='none'" style="background:transparent;border:none;color:#fff;opacity:.6;cursor:pointer;font-size:20px;padding:0 4px">✕</button>
  </div>
</div>
<script>
  // Countdown timer — 24h from page load
  const TIMER_KEY = 'offer_end_' + 'cold-email-writer-tool';
  let endTime = localStorage.getItem(TIMER_KEY);
  if (!endTime) { endTime = Date.now() + 24 * 3600 * 1000; localStorage.setItem(TIMER_KEY, endTime); }
  const banner = document.getElementById('launch-banner');
  function updateTimer() {
    const left = Math.max(0, endTime - Date.now());
    const h = Math.floor(left / 3600000);
    const m = Math.floor((left % 3600000) / 60000);
    const s = Math.floor((left % 60000) / 1000);
    const el = document.getElementById('banner-timer');
    if (el) el.textContent = `Offer expires in ${h}h ${m}m ${s}s`;
    if (left === 0 && banner) banner.style.display = 'none';
  }
  setInterval(updateTimer, 1000);
  setTimeout(() => { banner.parentNode.insertBefore(Object.assign(document.createElement('div'), {id:'banner-timer',style:'font-size:11px;opacity:.7;margin-top:2px'}), banner.querySelector('div').nextSibling); }, 100);
</script>
</body>
</html>
